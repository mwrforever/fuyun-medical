<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 富云医院信息系统（纸质病案样稿 v2）</title>
<!-- 内联 data-URI 图标：纸面三规线意象（墨规/灰墨/石规三档落在纸白上），
     色值全取既有 token（#fdfcf8/#1e2a44/#565d6e/#c6c0ae），零网络请求 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23fdfcf8'/%3E%3Crect x='7' y='8' width='18' height='2.5' rx='1' fill='%231e2a44'/%3E%3Crect x='7' y='14' width='18' height='2.5' rx='1' fill='%23565d6e'/%3E%3Crect x='7' y='20' width='12' height='2.5' rx='1' fill='%23c6c0ae'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./paper-chart.css">
<style>
/* ============================================================
   登录页 v2 · 全视口沉浸式两栏构图（批次 2 册 1 契约 §2 静态样稿）
   ------------------------------------------------------------
   语义：翻开当日病案前的身份确认页——全站唯一全视口页面，
         「纸质病案」世界的门厅：左栏是病历夹的墨脊封皮（世界叙事面），
         右栏是摊开的病案纸工作面（表单工作面）。医护推门进来先站
         在这页纸上，身份签认后才被领入墨脊书脊的工作世界。
   构图：左栏＝墨脊书脊 #1a2540 沉浸底（品牌字标 + 系统名 + 世界叙事
         文案 + 描边墨印「启」+「谁·何时」批注行 + 病案标签架/纸层
         意象，全部纯 CSS 几何、件件承世界语义）；
         右栏＝纸面三级（工作面 #f5f3ec / 卡面 #fdfcf8 / 表单域 #ffffff），
         「富云医院信息系统 · 请登录」副题（「请登录」文案锚点保留），
         字段=登录名/口令，登录按钮=「墨即操作」浓墨实底，
         面板 2px 墨规收底（契约指定页级规线延续）。
   动效：遵 DESIGN.md 世界动效语法——时长三档 fast 120ms / base 200ms /
         slow 320ms，缓动 standard / enter，级联步长 40ms ≤5 档；
         进场编排＝品牌字标 → 左栏叙事逐层 → 标签架插签 → 右栏
         面板 → 标题 → 字段 → 按钮 → 审计注记；一切可交互元素
         悬停/聚焦/按压三态微交互（120ms 档）；校验错误与加载态
         有入场节奏（页内演示脚本驱动）。动画只动 transform/opacity。
   红线：零新色值（颜色只取 paper-chart.css token 与 DESIGN.md palette
         既有字面量，字面量出处逐处注明）；零 box-shadow（本页无弹层，
         沉浸感靠亮度差 + 规线 + 墨脊材质）；印泥朱只承状态（必填
         星号/校验错误文字语义除外，禁装饰）；零外链（系统字体栈，
         图标取 @element-plus/icons-vue@2.3.2 包内真实 SVG path 内联）；
         禁 lorem、禁伪数据（批注行空值以 — 占位，沿门牌批注语法）。
   ============================================================ */

/* ---------- 全视口两栏骨架：左墨脊封皮 + 右纸面工作面 ---------- */
.login-split {
  display: grid;
  grid-template-columns: minmax(520px, 6fr) minmax(0, 7fr);
  min-height: 100dvh;
}

/* ============================================================
   左栏 · 世界叙事面（墨脊书脊＝病历夹封皮）
   ============================================================ */
.login-spine {
  position: relative;
  display: flex;
  flex-direction: column;
  background: var(--fuy-rail);
  color: var(--fuy-rail-text);
  /* 书脊深墨缝：缝跟着面走——墨脊上的缝是缝在封皮上的深墨，不用灰线 */
  border-right: 1px solid var(--fuy-rail-deep);
}

/* 品牌头：与壳层导轨品牌头 56px 同高同形态的放大呼应（rhyme，非复制） */
.spine-brand {
  height: 56px;
  flex: none;
  display: flex;
  align-items: center;
  padding: 0 40px;
  background: var(--fuy-rail);
  border-bottom: 1px solid var(--fuy-rail-deep);
}
/* 品牌字标「富云」：亮纸白纸块 + 墨字（与导轨 brand-mark 同一物件，
   封皮尺度放大）；字距外扩以 padding 补偿尾随字距保证视觉居中 */
.spine-brand-mark {
  display: inline-flex;
  align-items: center;
  height: 40px;
  padding: 0 16px;
  background: var(--fuy-card);
  color: var(--fuy-rail-deep);
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 8px;
  text-indent: 8px;
  border-radius: 4px;
}

/* 叙事主体：垂直居中于品牌头与标签架之间的墨色旷野（沉浸呼吸） */
.spine-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 48px clamp(40px, 5vw, 72px) 40px;
}
.spine-content {
  max-width: 30em;
}

/* 系统名：门牌标题档（20px/600）落在墨脊上取书脊纸纱字 */
.spine-sysname {
  margin: 0;
  font-size: 20px;
  font-weight: 600;
  line-height: 1.3;
  letter-spacing: 2px;
  color: var(--fuy-rail-text);
}

/* 世界叙事文案：真实产品语义（全院业务闭环 + 留痕归档），面向医护；
   疏朗行距给出封皮排印的仪式感，灰度取书脊纸纱不抢字标 */
.spine-narrative {
  margin: 20px 0 0;
  font-size: 14px;
  line-height: 2;
  color: var(--fuy-rail-text);
}

/* 「谁·何时」批注组：描边墨印「启」+ 批注两行——
   启封印承「翻开当日病案」语义（朱印只承危急，此处身份标记用墨印；
   墨脊上即墨不可见，沿导轨焦点环同款推论取纸纱白描边）；
   批注行沿「谁·何时」语法，登录前身份与时刻均未成立，
   空值以 — 占位（DESIGN.md 门牌批注「空值以 — 占位」语法），
   不落伪数据 */
.spine-seal-row {
  margin-top: 48px;
  display: flex;
  align-items: center;
  gap: 24px;
}
.spine-seal {
  flex: none;
  width: 88px;
  height: 88px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1.5px solid var(--fuy-rail-dim);
  border-radius: 2px;
  color: var(--fuy-rail-dim);
  font-size: 40px;
  font-weight: 600;
  /* 手钤印微倾：印章家族姿态（.stamp--solid rotate(-2deg) 同语法放大档） */
  transform: rotate(-6deg);
}
.spine-seal-label {
  margin: 0;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 1px;
  color: var(--fuy-rail-dim);
}
.spine-note {
  margin: 8px 0 0;
  font-size: 12px;
  color: var(--fuy-rail-dim);
}
.spine-note .spine-placeholder {
  padding: 0 2px;
}

/* ============================================================
   左栏 · 病案标签架 + 纸层意象（封皮底部铅封构图，纯 CSS 几何）
   语义：登录前先看见封皮里待翻的病案——五枚标签 = 五大业务域
   （门诊/住院/药房/护理/收费，真实产品域，零伪数据），
   三层纸缘 = 封皮内页块的层进透视（纸白三级亮度差，零投影）。
   ============================================================ */
.spine-chart {
  flex: none;
  margin-top: auto;
}
.chart-tabs {
  display: flex;
  align-items: flex-end;
  gap: 6px;
  padding: 0 48px;
}
.chart-tab {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 36px;
  padding: 0 14px;
  background: var(--fuy-card);
  border: 1px solid var(--fuy-rule);
  border-bottom: 0;
  border-radius: 2px 2px 0 0;
  color: var(--fuy-ink);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 2px;
}
/* 相邻标签高低错落：病案夹签的真实排布姿态 */
.chart-tab:nth-child(even) { height: 31px; }

/* 纸层意象：封皮内页块的顶缘三级——最亮纸面在上、卡面次之、
   工作面最沉，层间发丝缝分页；逐层内收表达层进透视 */
.chart-paper { padding: 0 40px; }
.chart-paper-layer { border-radius: 2px 2px 0 0; }
.chart-paper-layer--1 { height: 12px; background: var(--fuy-input); }
.chart-paper-layer--2 {
  height: 10px;
  margin: 0 8px;
  background: var(--fuy-card);
  border-top: 1px solid var(--fuy-rule);
}
.chart-paper-layer--3 {
  height: 8px;
  margin: 0 16px;
  background: var(--fuy-page);
  border-top: 1px solid var(--fuy-rule);
}

/* ============================================================
   右栏 · 表单工作面（纸面三级：工作面沉底，登录表为搁在纸上的卡面）
   ============================================================ */
.login-face {
  position: relative;
  display: grid;
  place-items: center;
  padding: 48px 40px 64px;
  background: var(--fuy-page);
}
.login-panel {
  width: 400px;
  max-width: 100%;
  background: var(--fuy-card);
  border: 1px solid var(--fuy-rule-strong);
  /* 契约 §2：表单区 2px 墨规收底——页级压章线，覆盖下缘石规 */
  border-bottom: 2px solid var(--fuy-rule-ink);
  border-radius: 8px;
  padding: 32px 32px 28px;
}

/* 卡头：副题「富云医院信息系统 · 请登录」（「请登录」为现行文案锚点）
   + 描边墨印「签」（登录即签认身份，墨印承标记；纸面上即墨可见）；
   发丝线为卡内细缝（规线三级不越级） */
.login-panel-head {
  display: flex;
  align-items: center;
  gap: 12px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--fuy-rule);
}
.login-panel-head h2 {
  margin: 0;
  font-size: 16px;
  font-weight: 600;
  line-height: 1.3;
  color: var(--fuy-ink);
}
.login-seal {
  margin-left: auto;
  flex: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 22px;
  height: 22px;
  padding: 0 4px;
  border: 1.5px solid var(--fuy-ink);
  border-radius: 2px;
  color: var(--fuy-ink);
  font-size: 12px;
  font-weight: 600;
  line-height: 1;
}

/* ---------- 字段：label 关联 + 必填朱星号（朱只承状态语义） ---------- */
.login-field {
  margin-top: 18px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.login-field label {
  font-size: 13px;
  color: var(--fuy-ink-2);
}
.login-field label .req {
  font-style: normal;
  color: var(--fuy-zhu);
  margin-left: 2px;
}

/* 输入围合：表单域最亮纸面 #ffffff + 石规描边；域内图标 + 输入
   （/口令可见性切换）成列。悬停描边转灰墨（EP 悬停描边同值档）、
   聚焦描边转浓墨——120ms fast 档三态微交互 */
.login-box {
  display: flex;
  align-items: center;
  height: 40px;
  padding: 0 10px;
  gap: 8px;
  background: var(--fuy-input);
  border: 1px solid var(--fuy-rule-strong);
  border-radius: 4px;
  transition: border-color var(--fuy-t-fast) var(--fuy-ease-standard);
}
.login-box:hover { border-color: var(--fuy-ink-2); }
/* 聚焦＝描边转墨 + 即墨焦点环上移到围合层（环随箱体几何，无双框）；
   文本域获得焦点时恒匹配 focus-visible 语义，键盘/鼠标同一可见环 */
.login-box:focus-within {
  border-color: var(--fuy-ink);
  outline: 2px solid var(--fuy-ink);
  outline-offset: 2px;
}

/* 域图标：icons-vue 2.3.2 包内真实 path 内联（User=登录名 / Lock=口令，
   契约 §2 指定），fill 跟随 currentColor；聚焦随域转墨 */
.login-ico {
  flex: none;
  width: 16px;
  height: 16px;
  color: var(--fuy-ink-3);
  transition: color var(--fuy-t-fast) var(--fuy-ease-standard);
}
.login-box:focus-within .login-ico { color: var(--fuy-ink); }

.login-input {
  flex: 1;
  min-width: 0;
  height: 100%;
  background: transparent;
  border: 0;
  font-size: 14px;
  color: var(--fuy-ink);
  caret-color: var(--fuy-ink);
}
.login-input::placeholder { color: var(--fuy-ink-3); }

/* 口令可见性切换：透明底按钮家族（顶栏语法），悬停纸面暖底转墨 */
.login-view-btn {
  flex: none;
  width: 28px;
  height: 28px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 0;
  border-radius: 4px;
  color: var(--fuy-ink-2);
  cursor: pointer;
  transition: background-color var(--fuy-t-fast) var(--fuy-ease-standard), color var(--fuy-t-fast) var(--fuy-ease-standard);
}
.login-view-btn:hover { background: #efece1; color: var(--fuy-ink); }   /* 纸面悬停暖底（paper-hover 既有档） */
.login-view-btn:active { background: #e9e7de; }                        /* 墨洗纸按压（paper-wash 既有档） */
.login-view-btn:focus-visible {
  outline: 2px solid var(--fuy-ink);
  outline-offset: 1px;
}
.login-view-btn .login-ico { color: currentColor; transition: none; }
/* SVG 命名空间元素不吃 UA 样式表的 [hidden] 规则（HTML 样式表只覆盖
   HTML 命名空间），显式补隐藏：保证 View/Hide 图标对互斥显示 */
.login-view-btn .login-ico[hidden] { display: none; }

/* 错误态：朱描边 + 字段级朱字提示（朱承校验状态非装饰；
   校验文案与现行 LoginView 规则口径一致，语义零改动） */
.login-box.is-error,
.login-box.is-error:focus-within { border-color: var(--fuy-zhu); }
/* 错误态聚焦环随朱（状态语义，v1 同语法） */
.login-box.is-error:focus-within { outline-color: var(--fuy-zhu); }
.login-box.is-error .login-ico { color: var(--fuy-zhu); }
/* 错误提示入场节奏：上 4px 沉落 + 显影（弹层硬 snap 语法的域内
   同源变体），base 200ms enter 缓动——不生硬跳变 */
.login-error {
  margin: 0;
  font-size: 12px;
  color: var(--fuy-zhu);
  animation: fuy-login-note var(--fuy-t-base) var(--fuy-ease-enter) both;
}
.login-error[hidden] { display: none; }

/* ---------- 登录按钮：墨即操作（浓墨实底白字） ---------- */
.login-submit {
  margin-top: 26px;
  width: 100%;
  height: 40px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: var(--fuy-ink);
  border: 0;
  border-radius: 4px;
  color: #ffffff;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  /* 悬停/按压：契约指定档 light-3 #626a7c / dark-2 #182236，
     悬停微浮 1px / 按压落位（transform 通道，禁 width/height 动画） */
  transition: background-color var(--fuy-t-fast) var(--fuy-ease-standard), transform var(--fuy-t-fast) var(--fuy-ease-standard);
}
.login-submit:hover { background: #626a7c; transform: translateY(-1px); }
.login-submit:active { background: #182236; transform: translateY(0); }
.login-submit:focus-visible {
  outline: 2px solid var(--fuy-ink);
  outline-offset: 2px;
}
.login-submit[disabled] { cursor: default; transform: none; }
.login-submit-text { letter-spacing: 4px; text-indent: 4px; }

/* 加载态：域内旋转墨环（border 圆环 + transform 旋转，零图片零阴影）；
   登录中禁重复提交（与现行 LoginView submitting 语义一致） */
.login-btn-spinner {
  display: none;
  width: 14px;
  height: 14px;
  border: 2px solid rgba(253, 252, 248, 0.25);   /* 轨道取书脊纸纱弱档（导轨细轴同值） */
  border-top-color: var(--fuy-card);
  border-radius: 50%;
}
.login-submit.is-loading .login-btn-spinner { display: inline-block; animation: fuy-login-spin 900ms linear infinite; }

/* 合规注记：等保三级审计背景的真实性质提示（PRODUCT.md），弱墨不抢操作 */
.login-audit {
  margin: 16px 0 0;
  font-size: 12px;
  color: var(--fuy-ink-3);
  text-align: center;
}

/* 样稿脚注：坐落右栏底缘，不与登录表争位 */
.login-foot {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 16px;
  font-size: 12px;
  color: var(--fuy-ink-3);
  text-align: center;
}

/* ============================================================
   动效编排（契约 §2 核心维度）
   级联步长 40ms ≤5 档；动画只动 transform/opacity。
   时间轴（页面载入）：
     60ms   品牌字标（左栏第一笔）
     100ms  系统名
     140ms  世界叙事文案
     180ms  启封印 + 批注组（左栏叙事收束）
     220ms  纸层意象（封皮内页块浮现）
     260~420ms 标签架五签逐枚插签入档（40ms 步长 5 档，签名时刻）
     300ms  右栏登录卡整纸浮现（叙事先落、表单后至）
     360ms  卡头副题 → 400ms 登录名域 → 440ms 口令域
     480ms  登录按钮 → 520ms 审计注记
   ============================================================ */
.rise-in {
  animation: fuy-login-rise var(--fuy-t-slow) var(--fuy-ease-enter) both;
  animation-delay: var(--rise-delay, 0ms);
}
@keyframes fuy-login-rise {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
/* 插签入档：标签自纸层下方升起 14px，如插入封皮页块的签牌 */
.chart-tab {
  animation: fuy-login-tab var(--fuy-t-slow) var(--fuy-ease-enter) both;
  animation-delay: var(--rise-delay, 0ms);
}
@keyframes fuy-login-tab {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: translateY(0); }
}
/* 错误提示沉落显影（域内反馈节奏） */
@keyframes fuy-login-note {
  from { opacity: 0; transform: translateY(-4px); }
  to { opacity: 1; transform: translateY(0); }
}
/* 加载墨环旋转（唯一循环动画，reduced-motion 下停转直达静置） */
@keyframes fuy-login-spin {
  to { transform: rotate(360deg); }
}

/* ---------- reduced-motion 兜底：reduce 下全部直达终态 ----------
   时长压到 0.01ms 之外必须同时归零 animation-delay：进场编排的
   delay 最长 520ms，只压时长不压延时会留下「延迟闪现」——元素在
   reduce 下仍按原节奏逐个消失再出现，违背 DESIGN.md「reduce 下
   全部动画/过渡直达终态」的严格口径 */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-delay: 0s !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    transition-delay: 0s !important;
  }
}

/* ---------- 窄窗保底（非响应式设计：workstation 以 1440+ 桌面为
   唯一目标形态，此处仅防样稿破版，纵向堆叠两栏） ---------- */
@media (max-width: 960px) {
  .login-split { grid-template-columns: 1fr; }
  .login-spine { border-right: 0; border-bottom: 1px solid var(--fuy-rail-deep); }
  .spine-body { padding-top: 40px; padding-bottom: 32px; }
  .spine-chart { margin-top: 40px; }
  .login-face { min-height: 640px; }
}
</style>
</head>
<body>

<div class="login-split">

  <!-- 左栏 · 世界叙事面：病历夹墨脊封皮（品牌 → 叙事 → 启封印 → 标签架纸层） -->
  <aside class="login-spine" aria-label="富云医院信息系统">
    <header class="spine-brand rise-in" style="--rise-delay: 60ms;">
      <span class="spine-brand-mark">富云</span>
    </header>

    <div class="spine-body">
      <div class="spine-content">
        <h1 class="spine-sysname rise-in" style="--rise-delay: 100ms;">富云医院信息系统</h1>
        <p class="spine-narrative rise-in" style="--rise-delay: 140ms;">
          门诊、住院、药房与护理的临床文书，在同一份病案上闭环流转——写下即留痕，签认即归档。
        </p>

        <div class="spine-seal-row rise-in" style="--rise-delay: 180ms;">
          <!-- 描边墨印「启」：翻开当日病案的开卷标记（墨印承标记，朱印只承危急） -->
          <span class="spine-seal" aria-hidden="true">启</span>
          <div>
            <p class="spine-seal-label">当日病案 · 待启封</p>
            <!-- 「谁·何时」批注语法：登录前身份与时刻未成立，空值以 — 占位（零伪数据） -->
            <p class="spine-note">启封批注 · 签认人 <span class="spine-placeholder">—</span> · 开卷时刻 <span class="spine-placeholder">—</span></p>
          </div>
        </div>
      </div>
    </div>

    <!-- 病案标签架 + 纸层意象：五业务域签牌 + 封皮内页块顶缘（纯 CSS 几何） -->
    <div class="spine-chart" aria-hidden="true">
      <div class="chart-tabs">
        <span class="chart-tab" style="--rise-delay: 260ms;">门诊</span>
        <span class="chart-tab" style="--rise-delay: 300ms;">住院</span>
        <span class="chart-tab" style="--rise-delay: 340ms;">药房</span>
        <span class="chart-tab" style="--rise-delay: 380ms;">护理</span>
        <span class="chart-tab" style="--rise-delay: 420ms;">收费</span>
      </div>
      <div class="chart-paper rise-in" style="--rise-delay: 220ms;">
        <div class="chart-paper-layer chart-paper-layer--1"></div>
        <div class="chart-paper-layer chart-paper-layer--2"></div>
        <div class="chart-paper-layer chart-paper-layer--3"></div>
      </div>
    </div>
  </aside>

  <!-- 右栏 · 表单工作面：纸面三级铺陈 + 登录表（字段语义忠实现行 LoginView） -->
  <main class="login-face">
    <section class="login-panel rise-in" style="--rise-delay: 300ms;" aria-label="登录表单">
      <header class="login-panel-head rise-in" style="--rise-delay: 360ms;">
        <h2>富云医院信息系统 · 请登录</h2>
        <!-- 描边墨印「签」：登录即签认身份（墨印承标记；朱印只承危急，永不装饰） -->
        <span class="login-seal" aria-hidden="true">签</span>
      </header>

      <form id="login-form" novalidate>
        <div class="login-field rise-in" style="--rise-delay: 400ms;">
          <label for="login-name">登录名<em class="req" aria-hidden="true">*</em></label>
          <div class="login-box" id="login-name-box">
            <!-- icons-vue 2.3.2 包内 User 图标真实 path（契约 §2 登录名域指定） -->
            <svg class="login-ico" viewBox="0 0 1024 1024" aria-hidden="true"><path fill="currentColor" d="M512 512a192 192 0 1 0 0-384 192 192 0 0 0 0 384m0 64a256 256 0 1 1 0-512 256 256 0 0 1 0 512m320 320v-96a96 96 0 0 0-96-96H288a96 96 0 0 0-96 96v96a32 32 0 1 1-64 0v-96a160 160 0 0 1 160-160h448a160 160 0 0 1 160 160v96a32 32 0 1 1-64 0"/></svg>
            <input class="login-input" id="login-name" name="loginName" type="text"
                   placeholder="请输入登录名" autocomplete="username"
                   aria-describedby="login-name-err">
          </div>
          <p class="login-error" id="login-name-err" hidden></p>
        </div>

        <div class="login-field rise-in" style="--rise-delay: 440ms;">
          <label for="login-password">口令<em class="req" aria-hidden="true">*</em></label>
          <div class="login-box" id="login-password-box">
            <!-- icons-vue 2.3.2 包内 Lock 图标真实 path（契约 §2 口令域指定） -->
            <svg class="login-ico" viewBox="0 0 1024 1024" aria-hidden="true"><path fill="currentColor" d="M224 448a32 32 0 0 0-32 32v384a32 32 0 0 0 32 32h576a32 32 0 0 0 32-32V480a32 32 0 0 0-32-32zm0-64h576a96 96 0 0 1 96 96v384a96 96 0 0 1-96 96H224a96 96 0 0 1-96-96V480a96 96 0 0 1 96-96"/><path fill="currentColor" d="M512 544a32 32 0 0 1 32 32v192a32 32 0 1 1-64 0V576a32 32 0 0 1 32-32m192-160v-64a192 192 0 1 0-384 0v64zM512 64a256 256 0 0 1 256 256v128H256V320A256 256 0 0 1 512 64"/></svg>
            <input class="login-input" id="login-password" name="password" type="password"
                   placeholder="请输入口令" autocomplete="current-password"
                   aria-describedby="login-password-err">
            <!-- 口令可见性切换：View/Hide 图标对（icons-vue 包内真实 path），
                 对应现行 LoginView show-password 语义 -->
            <button class="login-view-btn" id="login-view-toggle" type="button"
                    aria-label="显示口令" aria-pressed="false">
              <svg class="login-ico" id="login-ico-view" viewBox="0 0 1024 1024" aria-hidden="true"><path fill="currentColor" d="M512 160c320 0 512 352 512 352S832 864 512 864 0 512 0 512s192-352 512-352m0 64c-225.28 0-384.128 208.064-436.8 288 52.608 79.872 211.456 288 436.8 288 225.28 0 384.128-208.064 436.8-288-52.608-79.872-211.456-288-436.8-288m0 64a224 224 0 1 1 0 448 224 224 0 0 1 0-448m0 64a160.19 160.19 0 0 0-160 160c0 88.192 71.744 160 160 160s160-71.808 160-160-71.744-160-160-160"/></svg>
              <svg class="login-ico" id="login-ico-hide" viewBox="0 0 1024 1024" aria-hidden="true" hidden><path fill="currentColor" d="M876.8 156.8c0-9.6-3.2-16-9.6-22.4s-12.8-9.6-22.4-9.6-16 3.2-22.4 9.6L736 220.8c-64-32-137.6-51.2-224-60.8-160 16-288 73.6-377.6 176S0 496 0 512s48 73.6 134.4 176c22.4 25.6 44.8 48 73.6 67.2l-86.4 89.6c-6.4 6.4-9.6 12.8-9.6 22.4s3.2 16 9.6 22.4 12.8 9.6 22.4 9.6 16-3.2 22.4-9.6l704-710.4c3.2-6.4 6.4-12.8 6.4-22.4m-646.4 528Q115.2 579.2 76.8 512q43.2-72 153.6-172.8C304 272 400 230.4 512 224c64 3.2 124.8 19.2 176 44.8l-54.4 54.4C598.4 300.8 560 288 512 288c-64 0-115.2 22.4-160 64s-64 96-64 160c0 48 12.8 89.6 35.2 124.8L256 707.2c-9.6-6.4-19.2-16-25.6-22.4m140.8-96Q352 555.2 352 512c0-44.8 16-83.2 48-112s67.2-48 112-48c28.8 0 54.4 6.4 73.6 19.2zM889.599 336c-12.8-16-28.8-28.8-41.6-41.6l-48 48c73.6 67.2 124.8 124.8 150.4 169.6q-43.2 72-153.6 172.8c-73.6 67.2-172.8 108.8-284.8 115.2-51.2-3.2-99.2-12.8-140.8-28.8l-48 48c57.6 22.4 118.4 38.4 188.8 44.8 160-16 288-73.6 377.6-176S1024 528 1024 512s-48.001-73.6-134.401-176"/><path fill="currentColor" d="M511.998 672c-12.8 0-25.6-3.2-38.4-6.4l-51.2 51.2c28.8 12.8 57.6 19.2 89.6 19.2 64 0 115.2-22.4 160-64 41.6-41.6 64-96 64-160 0-32-6.4-64-19.2-89.6l-51.2 51.2c3.2 12.8 6.4 25.6 6.4 38.4 0 44.8-16 83.2-48 112s-67.2 48-112 48"/></svg>
            </button>
          </div>
          <p class="login-error" id="login-password-err" hidden></p>
        </div>

        <button class="login-submit rise-in" id="login-submit" style="--rise-delay: 480ms;" type="submit">
          <span class="login-btn-spinner" aria-hidden="true"></span>
          <span class="login-submit-text">登录</span>
        </button>
      </form>

      <p class="login-audit rise-in" style="--rise-delay: 520ms;">登录行为纳入审计日志 · 留存不少于六个月</p>
    </section>

    <p class="login-foot">设计样稿 ·「纸质病案」视觉世界 · 登录页 v2（册 1 契约 §2）</p>
  </main>

</div>

<script>
// 样稿演示脚本（无真实提交）：驱动校验错误态与登录中加载态的呈现节奏，
// 供实现端对照契约 §2「反馈节奏」。校验规则与现行 LoginView 完全一致：
// 两字段必填 + 长度 4-64 个字符。
(function () {
  'use strict';

  var form = document.getElementById('login-form');
  var nameInput = document.getElementById('login-name');
  var pwdInput = document.getElementById('login-password');
  var nameBox = document.getElementById('login-name-box');
  var pwdBox = document.getElementById('login-password-box');
  var nameErr = document.getElementById('login-name-err');
  var pwdErr = document.getElementById('login-password-err');
  var submitBtn = document.getElementById('login-submit');
  var viewToggle = document.getElementById('login-view-toggle');
  var icoView = document.getElementById('login-ico-view');
  var icoHide = document.getElementById('login-ico-hide');

  /** 呈现字段错误态：朱描边 + 提示文案入场（移除 hidden 即重放入场动画） */
  function showError(box, errEl, input, message) {
    box.classList.add('is-error');
    input.setAttribute('aria-invalid', 'true');
    errEl.textContent = message;
    errEl.hidden = false;
  }

  /** 清除字段错误态：输入即消错（与 blur/提交校验通道解耦的演示口径） */
  function clearError(box, errEl, input) {
    box.classList.remove('is-error');
    input.removeAttribute('aria-invalid');
    errEl.hidden = true;
    errEl.textContent = '';
  }

  // 口令可见性切换：password/text 互换 + View/Hide 图标互换 + aria 同步
  viewToggle.addEventListener('click', function () {
    var revealed = viewToggle.getAttribute('aria-pressed') === 'true';
    viewToggle.setAttribute('aria-pressed', String(!revealed));
    viewToggle.setAttribute('aria-label', revealed ? '显示口令' : '隐藏口令');
    pwdInput.setAttribute('type', revealed ? 'password' : 'text');
    icoView.hidden = !revealed;
    icoHide.hidden = revealed;
  });

  // 输入即消错：错误一旦出现，用户修正输入立即清除，不残留陈旧报错
  nameInput.addEventListener('input', function () { clearError(nameBox, nameErr, nameInput); });
  pwdInput.addEventListener('input', function () { clearError(pwdBox, pwdErr, pwdInput); });

  // 提交演示：空/短字段 → 错误态入场；通过校验 → 登录中加载态 1.2s 后复位
  form.addEventListener('submit', function (event) {
    event.preventDefault();
    if (submitBtn.classList.contains('is-loading')) {
      return; // 登录中防重复提交（与现行 LoginView submitting 语义一致）
    }

    // 校验演示（必填 + 长度 4-64，文案取现行 LoginView 规则口径）
    var nameValue = nameInput.value.trim();
    var pwdValue = pwdInput.value;
    var valid = true;

    if (!nameValue) {
      showError(nameBox, nameErr, nameInput, '请输入登录名');
      valid = false;
    } else if (nameValue.length < 4 || nameValue.length > 64) {
      showError(nameBox, nameErr, nameInput, '长度须为 4-64 个字符');
      valid = false;
    }

    if (!pwdValue) {
      showError(pwdBox, pwdErr, pwdInput, '请输入口令');
      valid = false;
    } else if (pwdValue.length < 4 || pwdValue.length > 64) {
      showError(pwdBox, pwdErr, pwdInput, '长度须为 4-64 个字符');
      valid = false;
    }

    if (!valid) {
      return;
    }

    // 加载态演示：墨环旋转 + 按钮禁用；样稿无真实登录，1.2s 后复位
    submitBtn.classList.add('is-loading');
    submitBtn.setAttribute('aria-busy', 'true');
    submitBtn.disabled = true;
    window.setTimeout(function () {
      submitBtn.classList.remove('is-loading');
      submitBtn.removeAttribute('aria-busy');
      submitBtn.disabled = false;
    }, 1200);
  });
}());
</script>

</body>
</html>
