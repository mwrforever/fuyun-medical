<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>富云医院信息系统 · 登录</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700;900&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
/* ============ 设计令牌：主色保持不变 ============ */
:root{
  --paper:        #f4ecdb;
  --paper-deep:   #eadfc8;
  --paper-edge:   #d8c9a8;
  --ink:          #2a2318;
  --ink-soft:     #5a4c38;
  --ink-faint:    #8a7a5e;
  --cinnabar:     #a5352c;
  --cinnabar-dk:  #82251f;
  --cinnabar-lt:  #c7544a;
  --gold:         #b08d4f;
  --line:         rgba(90, 76, 56, .22);
  --shadow-lg:    0 24px 60px -12px rgba(60, 46, 28, .28), 0 4px 12px rgba(60, 46, 28, .10);
  --shadow-md:    0 10px 24px -6px rgba(60, 46, 28, .18);
  --shadow-sm:    0 4px 10px rgba(60, 46, 28, .10);
  --ease-out:     cubic-bezier(.22, 1, .36, 1);
  --ease-ink:     cubic-bezier(.65, .05, .36, 1);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Noto Serif SC","Songti SC","SimSun",Georgia,serif;
  color:var(--ink);
  background:var(--paper);
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:center;
  padding:24px;
}

/* ============ 纸纹背景层 ============ */
.paper-bg{position:fixed;inset:0;z-index:0;pointer-events:none}
.paper-bg::before{
  content:"";position:absolute;inset:0;
  background:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40'><g fill='none' stroke='%235a4c38' stroke-opacity='.13'><rect x='11' y='11' width='18' height='18'/><rect x='16' y='16' width='8' height='8'/></g></svg>") repeat,
    radial-gradient(ellipse 80% 60% at 20% 10%, rgba(255,250,235,.55), transparent 60%),
    radial-gradient(ellipse 70% 50% at 85% 90%, rgba(120,95,60,.10), transparent 60%),
    linear-gradient(160deg, #f7f0e0 0%, #f2e8d2 45%, #ecdfc4 100%);
}
.paper-bg::after{
  content:"";position:absolute;inset:0;opacity:.35;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/><feColorMatrix type='saturate' values='0'/></filter><rect width='200' height='200' filter='url(%23n)' opacity='0.35'/></svg>");
}

/* ================================================================
   外部留白 · 动效底纹系统（全部位于 z-index:0，
   被卡片 z-index:1 遮挡，只在四周空白处可见）
   ================================================================ */
.bg-ink,.bg-seal,.bg-clouds,.bg-chars,.bg-sheen{
  position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
}

/* —— 层1：墨晕呼吸 —— */
.ink-blob{position:absolute;border-radius:50%;filter:blur(60px)}
.ink-blob.b1{
  width:420px;height:420px;left:-8%;top:-10%;
  background:radial-gradient(circle, rgba(176,141,79,.16), transparent 70%);
  animation:ink-breathe 11s ease-in-out infinite;
}
.ink-blob.b2{
  width:520px;height:520px;right:-12%;top:28%;
  background:radial-gradient(circle, rgba(165,53,44,.10), transparent 70%);
  animation:ink-breathe 14s 2s ease-in-out infinite;
}
.ink-blob.b3{
  width:460px;height:460px;left:20%;bottom:-18%;
  background:radial-gradient(circle, rgba(90,76,56,.12), transparent 70%);
  animation:ink-breathe 17s 4s ease-in-out infinite;
}
@keyframes ink-breathe{
  0%,100%{transform:scale(1);opacity:.65}
  50%{transform:scale(1.12);opacity:1}
}

/* —— 层2：缓旋双印 —— */
.bg-seal .seal{position:absolute}
.bg-seal .s1{
  top:-70px;right:5%;width:280px;height:280px;
  color:var(--cinnabar);opacity:.07;
  animation:seal-spin 130s linear infinite;
}
.bg-seal .s2{
  bottom:-50px;left:4%;width:220px;height:220px;
  color:var(--ink-soft);opacity:.05;
  animation:seal-spin 170s linear infinite reverse;
}
@keyframes seal-spin{to{transform:rotate(360deg)}}

/* —— 层3：祥云缓移 —— */
.cloud{position:absolute;left:0;will-change:transform}
.cloud.c1{top:11%;width:150px;opacity:.09;color:var(--cinnabar);animation:cloud-drift 70s linear infinite}
.cloud.c2{top:55%;width:105px;opacity:.06;color:var(--ink-faint);animation:cloud-drift 95s 18s linear infinite}
.cloud.c3{top:79%;width:180px;opacity:.05;color:var(--gold);animation:cloud-drift 120s 40s linear infinite}
@keyframes cloud-drift{
  from{transform:translateX(-240px)}
  to{transform:translateX(calc(100vw + 240px))}
}

/* —— 层4：浮墨字 —— */
.fchar{
  position:absolute;top:100%;left:0;
  font-family:"Ma Shan Zheng","Noto Serif SC",serif;
  opacity:0;will-change:transform,opacity;
  animation:char-float 30s linear infinite;
}
.fchar.f1{left:4%;font-size:120px;color:var(--ink)}
.fchar.f2{left:11%;font-size:88px;color:var(--cinnabar);animation-delay:10s}
.fchar.f3{right:6%;left:auto;font-size:140px;color:var(--ink-soft);animation-delay:19s}
@keyframes char-float{
  0%{transform:translateY(0);opacity:0}
  10%{opacity:.055}
  82%{opacity:.04}
  100%{transform:translateY(-132vh);opacity:0}
}

/* —— 层5：底部双线流水 —— */
.bg-waves{position:fixed;left:0;right:0;bottom:0;height:120px;z-index:0;pointer-events:none}
.wave{position:absolute;left:0;right:0;height:60px;overflow:hidden}
.wave::before{
  content:"";position:absolute;left:0;top:0;height:100%;
  width:calc(100% + 240px);
  background-repeat:repeat-x;background-position:left center;
  background-size:240px 60px;
}
.wave.w1{bottom:6px;opacity:.35}
.wave.w1::before{
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='60' viewBox='0 0 240 60'><path d='M0 30 q30 -20 60 0 t60 0 t60 0 t60 0' fill='none' stroke='%23b08d4f' stroke-width='1.5' stroke-linecap='round'/></svg>");
  animation:wave-flow 22s linear infinite;
}
.wave.w2{bottom:22px;opacity:.22}
.wave.w2::before{
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='60' viewBox='0 0 240 60'><path d='M0 30 q30 -13 60 0 t60 0 t60 0 t60 0' fill='none' stroke='%238a7a5e' stroke-width='1.2' stroke-linecap='round'/></svg>");
  animation:wave-flow 34s linear infinite reverse;
}
@keyframes wave-flow{to{transform:translateX(-240px)}}

/* —— 层6：光带缓扫 —— */
.bg-sheen{
  inset:-20%;
  background:linear-gradient(115deg, transparent 42%, rgba(255,250,235,.45) 50%, transparent 58%);
  transform:translateX(-60%);
  animation:sheen 16s ease-in-out infinite;
  will-change:transform,opacity;
}
@keyframes sheen{
  0%{transform:translateX(-60%);opacity:0}
  15%{opacity:.45}
  45%{transform:translateX(60%);opacity:.45}
  55%,100%{transform:translateX(60%);opacity:0}
}

/* ============ 页面级边框：静态底线 + 朱砂走线 ============ */
.page-frame{
  position:fixed;inset:12px;z-index:0;pointer-events:none;
  border:1px solid rgba(90,76,56,.14);border-radius:10px;
}
.page-flow{
  position:fixed;inset:12px;z-index:0;pointer-events:none;overflow:visible;
}
.page-flow rect{
  x:1px;y:1px;
  width:calc(100% - 2px);height:calc(100% - 2px);
  rx:10px;
  fill:none;stroke:rgba(165,53,44,.38);stroke-width:1.2;
  stroke-dasharray:18 14;
  animation:frame-march 26s linear infinite;
}
@keyframes frame-march{to{stroke-dashoffset:-64}}

/* ============ 四角回字纹 ============ */
.pcorner{
  position:fixed;width:60px;height:60px;z-index:0;pointer-events:none;opacity:.42;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='60' height='60' viewBox='0 0 60 60'><g fill='none' stroke='%23a5352c' stroke-width='1.8' stroke-linecap='round'><path d='M20 2 H12 Q2 2 2 12 V20'/><path d='M18 10 H14 Q10 10 10 14 V18'/></g><circle cx='30' cy='30' r='1.8' fill='%23a5352c'/></svg>") no-repeat center/contain;
}
.pcorner.tl{top:8px;left:8px}
.pcorner.tr{top:8px;right:8px;transform:scaleX(-1)}
.pcorner.bl{bottom:8px;left:8px;transform:scaleY(-1)}
.pcorner.br{bottom:8px;right:8px;transform:scale(-1,-1)}

/* ============ 主布局 ============ */
.stage{
  position:relative;z-index:1;
  width:100%;max-width:1160px;
  display:grid;grid-template-columns:1fr 1.05fr;gap:0;
  border-radius:14px;overflow:hidden;
  box-shadow:var(--shadow-lg);
  background:linear-gradient(160deg, #f8f2e3 0%, #f0e6cf 100%);
  border:1px solid var(--paper-edge);
  min-height:640px;
  animation:stage-in .8s var(--ease-out) both;
}
@keyframes stage-in{from{opacity:0;transform:translateY(24px) scale(.985)}to{opacity:1;transform:none}}

/* ============ 左侧封面 ============ */
.cover{
  position:relative;
  padding:56px 48px 40px;
  background:linear-gradient(135deg, rgba(255,252,244,.65) 0%, rgba(238,225,198,.35) 100%);
  border-right:1px dashed var(--line);
  display:flex;flex-direction:column;justify-content:space-between;
  overflow:hidden;
}
.cover::before{
  content:"";position:absolute;left:20px;top:24px;bottom:24px;width:2px;
  background:repeating-linear-gradient(to bottom, var(--ink-faint) 0 8px, transparent 8px 16px);
  opacity:.4;
}
.cover-deco{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.cover-deco::before{
  content:"启";
  position:absolute;right:-30px;top:-40px;
  font-family:"Ma Shan Zheng","Noto Serif SC",serif;
  font-size:280px;line-height:1;
  color:rgba(165,53,44,.06);
  animation:seal-breathe 6s ease-in-out infinite;
}
@keyframes seal-breathe{
  0%,100%{opacity:.05;transform:rotate(-6deg) scale(1)}
  50%{opacity:.09;transform:rotate(-6deg) scale(1.03)}
}
.landscape{
  position:absolute;left:20px;right:0;bottom:6px;z-index:1;
  width:calc(100% - 40px);height:auto;
  pointer-events:none;
}
.cover-top{position:relative;z-index:2}
.brand{
  display:flex;align-items:center;gap:14px;
  animation:fade-up .8s .1s var(--ease-out) both;
}
.brand-mark{
  width:44px;height:44px;
  background:var(--cinnabar);color:#fdf6e3;
  border-radius:6px;display:grid;place-items:center;
  font-family:"Ma Shan Zheng","Noto Serif SC",serif;
  font-size:26px;
  box-shadow:var(--shadow-sm), inset 0 0 0 1.5px rgba(255,255,255,.18);
  position:relative;
  animation:seal-in .7s .2s var(--ease-ink) both;
}
.brand-mark::after{content:"";position:absolute;inset:4px;border-radius:3px;border:1px solid rgba(255,246,224,.5)}
@keyframes seal-in{
  0%{opacity:0;transform:scale(1.8) rotate(-18deg)}
  60%{opacity:1;transform:scale(.94) rotate(2deg)}
  100%{opacity:1;transform:scale(1) rotate(0)}
}
.brand-text{display:flex;flex-direction:column;gap:2px}
.brand-title{font-size:24px;font-weight:700;letter-spacing:.06em}
.brand-sub{font-size:11px;letter-spacing:.32em;color:var(--ink-faint)}
.cover-title{margin-top:52px;animation:fade-up .8s .25s var(--ease-out) both}
.cover-title .hero{
  font-family:"Ma Shan Zheng","Noto Serif SC",serif;
  font-size:56px;line-height:1.15;letter-spacing:.04em;
  background:linear-gradient(160deg, var(--ink) 20%, var(--ink-soft) 90%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.cover-title .tagline{
  margin-top:20px;font-size:14.5px;line-height:2;
  color:var(--ink-soft);max-width:28em;
  padding-left:14px;border-left:2px solid var(--cinnabar);
}
.tabs{margin-top:40px;display:flex;flex-wrap:wrap;gap:10px;animation:fade-up .8s .4s var(--ease-out) both}
.tab{
  padding:7px 16px 8px;font-size:13px;letter-spacing:.14em;
  color:var(--ink-soft);
  background:linear-gradient(to bottom, rgba(255,250,238,.85), rgba(236,224,200,.65));
  border:1px solid var(--paper-edge);border-radius:3px;
  box-shadow:var(--shadow-sm);position:relative;cursor:default;
  transition:transform .35s var(--ease-out), box-shadow .35s var(--ease-out), color .3s;
}
.tab::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:2px;
  background:var(--cinnabar);transform:scaleX(0);transform-origin:left;
  transition:transform .35s var(--ease-out);
}
.tab:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);color:var(--cinnabar)}
.tab:hover::after{transform:scaleX(1)}
.cover-foot{
  position:relative;z-index:2;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding-top:24px;border-top:1px dashed var(--line);
  animation:fade-up .8s .55s var(--ease-out) both;
}
.cover-foot .meta{font-size:11.5px;letter-spacing:.08em;color:var(--ink-faint);line-height:1.8}
.vertical-seal{
  writing-mode:vertical-rl;
  font-family:"Ma Shan Zheng","Noto Serif SC",serif;
  font-size:14px;letter-spacing:.3em;
  color:var(--cinnabar);padding:10px 6px;
  border:1.5px solid var(--cinnabar);border-radius:3px;
  background:rgba(165,53,44,.05);opacity:.85;
}

/* ============ 右侧病案内页 ============ */
.sheet{
  position:relative;
  padding:56px 56px 40px;
  display:flex;flex-direction:column;
  background:linear-gradient(to bottom, rgba(255,252,244,.6), rgba(244,236,219,.4));
  overflow:hidden;
}
.sheet::before{
  content:"";position:absolute;left:18px;top:28px;bottom:28px;width:2px;
  background:repeating-linear-gradient(to bottom, var(--gold) 0 10px, transparent 10px 20px);
  opacity:.35;
}
.sheet::after{
  content:"归";
  position:absolute;right:-18px;bottom:-58px;
  font-family:"Ma Shan Zheng","Noto Serif SC",serif;
  font-size:230px;line-height:1;
  color:rgba(165,53,44,.05);
  transform:rotate(-8deg);
  animation:seal-breathe 8s ease-in-out infinite reverse;
  pointer-events:none;
}
.sheet-texture{
  position:absolute;inset:0;z-index:0;pointer-events:none;
  opacity:.15;
  background-image:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='34' height='30' viewBox='0 0 34 30'><path d='M17 1 L32 8.5 V21.5 L17 29 L2 21.5 V8.5 Z' fill='none' stroke='%23b08d4f' stroke-width='1' opacity='.55'/></svg>"),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='34' height='30' viewBox='0 0 34 30'><path d='M17 1 L32 8.5 V21.5 L17 29 L2 21.5 V8.5 Z' fill='none' stroke='%23b08d4f' stroke-width='1' opacity='.55'/></svg>");
  background-size:34px 30px, 34px 30px;
  background-position:0 0, 17px 15px;
}
.ornament{
  position:absolute;width:60px;height:60px;z-index:0;pointer-events:none;opacity:.5;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64' viewBox='0 0 64 64'><g fill='none' stroke='%23a5352c' stroke-width='1.6' stroke-linecap='round'><path d='M46 2 H12 Q2 2 2 12 V46'/><path d='M36 10 H16 Q10 10 10 16 V36'/><path d='M24 24 q7 0 7 7'/></g></svg>") no-repeat center/contain;
}
.ornament.c1{top:18px;left:32px}
.ornament.c2{top:18px;right:20px;transform:scaleX(-1)}
.ornament.c3{bottom:16px;left:32px;transform:scaleY(-1)}
.ornament.c4{bottom:16px;right:20px;transform:scale(-1,-1)}
.margin-clouds{
  position:absolute;right:22px;top:86px;bottom:86px;width:30px;z-index:0;
  pointer-events:none;opacity:.3;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='60' height='112' viewBox='0 0 60 112'><g fill='none' stroke='%23a5352c' stroke-width='1.4' stroke-linecap='round'><path d='M30 38 c-9 0 -15 -5 -15 -12 c0 -7 7 -12 13 -10 c1 -8 9 -13 16 -10 c6 2 8 8 7 13 c6 1 9 5 8 10 c-1 6 -6 9 -13 9 z'/><path d='M23 28 c0 -4 3 -7 7 -6 c3 1 4 4 3 6'/><path d='M12 62 q9 -5 18 0 t18 0'/><path d='M16 72 q7 -4 14 0 t14 0' opacity='.65'/></g><circle cx='30' cy='90' r='2' fill='%23a5352c'/></svg>") repeat-y center top;
  background-size:30px auto;
}
.margin-note{
  position:absolute;left:33px;top:50%;transform:translateY(-50%);z-index:0;
  writing-mode:vertical-rl;white-space:nowrap;
  font-size:10px;letter-spacing:.5em;
  color:var(--ink-faint);opacity:.6;pointer-events:none;
}
.sheet-head{position:relative;z-index:1;display:flex;align-items:flex-start;justify-content:space-between;gap:20px;animation:fade-up .8s .35s var(--ease-out) both}
.sheet-title{display:flex;flex-direction:column;gap:6px}
.sheet-title h2{font-size:22px;font-weight:700;letter-spacing:.08em}
.sheet-title .en{font-size:11px;letter-spacing:.24em;color:var(--ink-faint);font-family:Georgia,serif}
.sheet-status{text-align:right;font-size:11.5px;line-height:1.9;color:var(--ink-faint);letter-spacing:.06em}
.sheet-status .status-pill{
  display:inline-flex;align-items:center;gap:6px;
  padding:3px 10px;border-radius:20px;
  background:rgba(165,53,44,.08);border:1px solid rgba(165,53,44,.25);
  color:var(--cinnabar);font-size:11px;letter-spacing:.1em;margin-bottom:6px;
}
.status-dot{
  width:6px;height:6px;border-radius:50%;background:var(--cinnabar);
  box-shadow:0 0 0 3px rgba(165,53,44,.15);
  animation:pulse 2s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{opacity:1;box-shadow:0 0 0 3px rgba(165,53,44,.15)}
  50%{opacity:.6;box-shadow:0 0 0 6px rgba(165,53,44,.05)}
}
.divider{
  position:relative;z-index:1;
  margin:28px 0 32px;height:1px;
  background:linear-gradient(to right, transparent, var(--line) 15%, var(--line) 85%, transparent);
  animation:fade-up .8s .45s var(--ease-out) both;
}
.divider::after{
  content:"签";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  padding:0 14px;background:var(--paper);
  font-family:"Ma Shan Zheng","Noto Serif SC",serif;
  font-size:15px;color:var(--cinnabar);letter-spacing:.2em;
}
.div-cloud{
  position:absolute;top:50%;width:34px;height:16px;transform:translateY(-50%);
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='36' height='16' viewBox='0 0 36 16'><g fill='none' stroke='%23a5352c' stroke-width='1.4' stroke-linecap='round'><path d='M2 12 q8 -8 15 -4 q5 3 1 6 q-3 2 -4 -1'/><path d='M22 12 q6 -3 12 -2'/></g></svg>") no-repeat center/contain;
  opacity:.5;pointer-events:none;
}
.div-cloud.dl{left:20px}
.div-cloud.dr{right:20px;transform:translateY(-50%) scaleX(-1)}

/* ============ 表单 ============ */
.form{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;gap:24px;animation:fade-up .8s .55s var(--ease-out) both}
.field{position:relative}
.field-label{display:flex;align-items:center;gap:8px;font-size:12.5px;letter-spacing:.14em;color:var(--ink-soft);margin-bottom:8px}
.field-label .asterisk{color:var(--cinnabar);font-weight:700}
.field-label .hint{margin-left:auto;font-size:10.5px;letter-spacing:.1em;color:var(--ink-faint)}
.field-wrap{
  position:relative;display:flex;align-items:center;
  background:rgba(255,252,244,.75);
  border:1px solid var(--paper-edge);border-radius:4px;
  padding:0 14px;
  transition:border-color .3s, box-shadow .3s, background .3s;
}
.field-wrap:focus-within{
  border-color:var(--cinnabar);background:rgba(255,253,247,.95);
  box-shadow:0 0 0 3px rgba(165,53,44,.08);
}
.field-wrap input{
  flex:1;border:none;outline:none;background:transparent;
  padding:13px 0;font-family:inherit;font-size:15px;letter-spacing:.05em;color:var(--ink);
}
.field-wrap input::placeholder{color:var(--ink-faint);font-size:13.5px;letter-spacing:.12em}
.field-icon{color:var(--ink-faint);display:grid;place-items:center;width:20px;height:20px;margin-right:8px;transition:color .3s}
.field-wrap:focus-within .field-icon{color:var(--cinnabar)}
.field-underline{
  position:absolute;left:14px;right:14px;bottom:-1px;height:2px;
  background:linear-gradient(to right, var(--cinnabar), var(--cinnabar-lt));
  transform:scaleX(0);transform-origin:center;
  transition:transform .45s var(--ease-ink);border-radius:2px;
}
.field-wrap:focus-within .field-underline{transform:scaleX(1)}
.eye-btn{border:none;background:transparent;cursor:pointer;color:var(--ink-faint);padding:6px;border-radius:3px;display:grid;place-items:center;transition:color .3s, background .3s}
.eye-btn:hover{color:var(--cinnabar);background:rgba(165,53,44,.06)}
.field-error{
  display:flex;align-items:center;gap:6px;
  font-size:11.5px;color:var(--cinnabar);margin-top:6px;letter-spacing:.06em;
  opacity:0;transform:translateY(-4px);transition:opacity .3s, transform .3s;min-height:16px;
}
.field.error .field-error{opacity:1;transform:none}
.field.error .field-wrap{border-color:var(--cinnabar);animation:shake .45s var(--ease-out)}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

/* ============ 登录按钮 ============ */
.submit{
  position:relative;margin-top:8px;padding:15px 24px;
  border:none;cursor:pointer;
  background:linear-gradient(160deg, var(--cinnabar) 0%, var(--cinnabar-dk) 100%);
  color:#fdf6e3;font-family:inherit;font-size:15px;font-weight:600;letter-spacing:.3em;
  border-radius:4px;
  box-shadow:var(--shadow-md), inset 0 1px 0 rgba(255,255,255,.18);
  transition:transform .3s var(--ease-out), box-shadow .3s var(--ease-out), filter .3s;
  overflow:hidden;
}
.submit::before{
  content:"";position:absolute;inset:0;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='60' height='60'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.2' numOctaves='2'/><feColorMatrix type='saturate' values='0'/></filter><rect width='60' height='60' filter='url(%23n)' opacity='0.12'/></svg>");
  mix-blend-mode:overlay;pointer-events:none;
}
.submit::after{
  content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;
  background:linear-gradient(to right, transparent, rgba(255,240,220,.28), transparent);
  transform:skewX(-18deg);transition:left .6s var(--ease-out);
}
.submit:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg), inset 0 1px 0 rgba(255,255,255,.22);filter:brightness(1.06)}
.submit:hover::after{left:120%}
.submit:active{transform:translateY(1px) scale(.99)}
.submit:disabled{cursor:not-allowed;filter:grayscale(.3) brightness(.9)}
.submit .label{position:relative;z-index:2;display:inline-flex;align-items:center;gap:8px;transition:opacity .3s}
.submit.loading .label{opacity:0}
.submit .stamp-ring{
  position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;
  border:2px solid rgba(253,246,227,.4);border-top-color:#fdf6e3;border-radius:50%;
  opacity:0;transition:opacity .2s;
}
.submit.loading .stamp-ring{opacity:1;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============ 审计提示（页脚已删，由它自然贴底） ============ */
.audit{
  position:relative;z-index:1;
  margin-top:auto;padding:12px 16px;
  display:flex;align-items:center;gap:10px;
  font-size:11.5px;letter-spacing:.08em;color:var(--ink-faint);
  background:rgba(216,201,168,.2);
  border-left:2px solid var(--gold);border-radius:0 3px 3px 0;
  animation:fade-up .8s .65s var(--ease-out) both;
}
.audit svg{flex-shrink:0;color:var(--gold)}

/* ============ 成功印章浮层 ============ */
.stamp-toast{
  position:fixed;left:50%;top:50%;
  transform:translate(-50%,-50%) scale(.4) rotate(-16deg);z-index:99;
  padding:20px 28px;background:var(--cinnabar);color:#fdf6e3;
  font-family:"Ma Shan Zheng","Noto Serif SC",serif;
  font-size:24px;letter-spacing:.2em;border-radius:6px;
  box-shadow:0 20px 40px -10px rgba(130,37,31,.5);
  opacity:0;pointer-events:none;
  transition:opacity .35s var(--ease-ink), transform .5s var(--ease-ink);
}
.stamp-toast.show{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-8deg)}

@keyframes fade-up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ============ 无障碍：偏好减少动效时全部静止 ============ */
@media (prefers-reduced-motion: reduce){
  .ink-blob,.cloud,.fchar,.wave::before,.bg-sheen,
  .page-flow rect,.bg-seal .seal,.cover-deco::before,.sheet::after{animation:none !important}
}

/* ============ 响应式 ============ */
@media (max-width: 900px){
  .stage{grid-template-columns:1fr;min-height:auto}
  .cover{padding:36px 32px 28px;border-right:none;border-bottom:1px dashed var(--line)}
  .cover-title .hero{font-size:38px}
  .sheet{padding:36px 28px 28px}
  .sheet::before{display:none}
  .cover-deco::before{font-size:180px}
  .margin-clouds,.margin-note,.ornament,.div-cloud{display:none}
  .sheet::after{font-size:150px;bottom:-40px}
  .bg-clouds,.bg-chars,.bg-sheen,.page-flow{display:none}
}
@media (max-width: 620px){
  .page-frame,.page-flow,.pcorner{display:none}
  .bg-waves,.bg-seal{display:none}
  body{padding:12px}
}
</style>
</head>
<body>

<div class="paper-bg"></div>

<main class="stage">

  <!-- 左：封面 -->
  <section class="cover">

      <div class="cover-title">
        <h1 class="hero">以墨为凭 · 以纸为证</h1>
        <p class="tagline">门诊、住院、药房与护理的临床文书，在同一份病案上闭环流转——写下即留痕，签认即归档。</p>

    <svg class="landscape" viewBox="0 0 460 190" fill="none" aria-hidden="true">
      <circle cx="332" cy="84" r="24" stroke="#a5352c" stroke-width="2" opacity=".45"/>
      <circle cx="332" cy="84" r="31" stroke="#a5352c" stroke-width="1" opacity=".22" stroke-dasharray="3 7"/>
      <g stroke="#a5352c" stroke-width="1.8" stroke-linecap="round" opacity=".5">
        <path d="M96 74 c-11 0 -18 -6 -18 -14 c0 -8 8 -14 16 -12 c1 -9 10 -15 19 -12 c7 2 10 9 8 15 c7 1 11 6 10 12 c-1 7 -7 11 -16 11 z"/>
        <path d="M88 60 c0 -5 4 -8 8 -7 c4 1 5 5 3 8"/>
        <path d="M150 92 c10 -3 20 -3 30 0"/>
        <path d="M156 102 c7 -2 14 -2 21 0" stroke-width="1.5" opacity=".8"/>
      </g>
      <g stroke="#8a7a5e" stroke-width="1.4" opacity=".35">
        <path d="M300 108 c-9 0 -14 -5 -14 -11 c0 -6 6 -11 13 -10 c1 -7 8 -12 15 -9 c5 2 8 7 6 12 c5 1 8 5 7 9 c-1 6 -5 9 -13 9 z"/>
      </g>
      <g stroke="#5a4c38" stroke-linecap="round" fill="none">
        <path d="M18 148 Q64 98 108 126 Q136 84 178 118 Q214 96 258 136" stroke-width="2" opacity=".5"/>
        <path d="M60 148 Q120 120 168 140 Q230 112 300 142 Q368 122 442 146" stroke-width="1.5" opacity=".32"/>
      </g>

        <path d="M20 178 q13 -7 26 0 t26 0 t26 0 t26 0 t26 0 t26 0 t26 0 t26 0 t26 0 t26 0 t26 0 t26 0 t26 0 t26 0 t26 0" stroke-width="1.2" opacity=".35"/>

    <div class="cover-foot">

        册 1 · 契约 §2<br>

  </section>

  <!-- 右：病案内页（登录） -->
  <section class="sheet">
    <div class="sheet-texture"></div>

    <i class="ornament c3"></i><i class="ornament c4"></i>
    <div class="margin-clouds"></div>
    <div class="margin-note">闭环流转 · 永续留痕 · 签认归档</div>

    <div class="sheet-head">
      <div class="sheet-title">

    <form class="form" id="loginForm" novalidate>

      <div class="field" id="fieldUser">

            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>

          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>

          </button>
          <span class="field-underline"></span>

        <div class="field-error">

<div class="stamp-toast" id="stampToast">启封成功</div>

<script>
// ---------- 口令可见切换 ----------
const pwdInput = document.getElementById('password');
const eyeBtn   = document.getElementById('togglePwd');
const eyeIcon  = document.getElementById('eyeIcon');
eyeBtn.addEventListener('click', () => {
  const isPwd = pwdInput.type === 'password';
  pwdInput.type = isPwd ? 'text' : 'password';
  eyeIcon.innerHTML = isPwd
    ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>'
    : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
});

// ---------- 校验 ----------
function setError(fieldId, show){
  const f = document.getElementById(fieldId);
  if (show) f.classList.add('error');
  else f.classList.remove('error');
}
['username','password'].forEach(id => {
  const input = document.getElementById(id);
  input.addEventListener('input', () => setError('field' + (id === 'username' ? 'User' : 'Pwd'), false));
});

// ---------- 提交 ----------
const form      = document.getElementById('loginForm');
const submitBtn = document.getElementById('submitBtn');
const toast     = document.getElementById('stampToast');

form.addEventListener('submit', e => {
  e.preventDefault();
  const u = document.getElementById('username').value.trim();
  const p = pwdInput.value;
  let ok = true;
  if (!u){ setError('fieldUser', true); ok = false; }
  if (!p){ setError('fieldPwd', true);  ok = false; }
  if (!ok) return;

  submitBtn.disabled = true;
  submitBtn.classList.add('loading');

  setTimeout(() => {
    submitBtn.classList.remove('loading');
    submitBtn.disabled = false;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1600);
    // TODO: 这里替换为真实登录请求
  }, 1200);
});

// ---------- 外部底纹·鼠标视差 ----------
(() => {
  const fine = matchMedia('(pointer:fine)').matches;
  const noMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!fine || noMotion) return;

  const layers = [
    { el: document.querySelector('.bg-clouds'), fx: 22,  fy: 14 },
    { el: document.querySelector('.bg-seal'),   fx: -14, fy: -10 },
    { el: document.querySelector('.bg-chars'),  fx: 8,   fy: 6  },
    { el: document.querySelector('.bg-ink'),    fx: 5,   fy: 4  },
  ].filter(l => l.el);

  let tx = 0, ty = 0, cx = 0, cy = 0;
  addEventListener('mousemove', e => {
    tx = e.clientX / innerWidth  - .5;
    ty = e.clientY / innerHeight - .5;
  }, { passive: true });

  (function raf(){
    cx += (tx - cx) * .04;
    cy += (ty - cy) * .04;
    for (const l of layers){
      l.el.style.transform = `translate3d(${(cx * l.fx).toFixed(2)}px, ${(cy * l.fy).toFixed(2)}px, 0)`;
    }
    requestAnimationFrame(raf);
  })();
})();
</script>
