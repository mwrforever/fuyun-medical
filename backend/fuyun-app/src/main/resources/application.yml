# 全环境公共配置：只放公共项与安全默认值，dev/test/prod 差异见 application-{profile}.yml（backend 宪法 A.2-1）
spring:
  application:
    name: fuyun-backend
  mvc:
    problemdetails:
      enabled: true            # 失败响应一律 RFC 9457 ProblemDetail（backend 宪法 A.3-2）
  lifecycle:
    timeout-per-shutdown-phase: 30s   # 优雅停机宽限期与 compose stop_grace_period 对齐（backend 宪法 A.5-15）
  datasource:
    hikari:
      minimum-idle: 10         # 固定大小池（minimumIdle=maximumPoolSize），起步值压测校准（backend 宪法 A.4.2-6）
      maximum-pool-size: 10
  flyway:
    out-of-order: ${FUYUN_FLYWAY_OUT_OF_ORDER:false}   # 默认 false 红线不变；仅存量库一次性承接号段初始化批次时经临时容器注入 true（审查 C5 路径 A，步骤/验证/还原防呆见 Task 16 Step 3）
    baseline-on-migrate: false
    default-schema: public     # 公共 schema（PG 默认 public）承载 flyway_schema_history（backend 宪法 A.4.1-4）
    schemas:                   # 全量声明，Flyway 自动创建缺失 schema
      - public
      - system
      - patient
      - outpatient
      - inpatient
      - nursing
      - pharmacy
      - lab
      - imaging
      - emr
      - surgery
      - icu
      - transfusion
      - billing
      - iot
      - asset
      - ward
      - peis
      - internet
      - ops
      - integration
    locations:                 # 显式枚举 20 模块迁移目录，禁通配符（backend 宪法 A.4.1-4）
      - classpath:db/migration/system
      - classpath:db/migration/patient
      - classpath:db/migration/outpatient
      - classpath:db/migration/inpatient
      - classpath:db/migration/nursing
      - classpath:db/migration/pharmacy
      - classpath:db/migration/lab
      - classpath:db/migration/imaging
      - classpath:db/migration/emr
      - classpath:db/migration/surgery
      - classpath:db/migration/icu
      - classpath:db/migration/transfusion
      - classpath:db/migration/billing
      - classpath:db/migration/iot
      - classpath:db/migration/asset
      - classpath:db/migration/ward
      - classpath:db/migration/peis
      - classpath:db/migration/internet
      - classpath:db/migration/ops
      - classpath:db/migration/integration
  modulith:
    events:
      # 重启不重发未完成事件：多实例下与其他在处理实例产生重复投递（仅单实例安全）；
      # 未完成事件的重试统一走 EventOpsJob 定时重投（D-2 裁决设计，宪法 B.3-3）
      republish-outstanding-events-on-restart: false
      jdbc:
        # 事件日志表只经 Flyway 建表（宪法 A.4.1，V6 迁移负责 event_publication）；
        # 显式钉死防上游默认翻转
        schema-initialization:
          enabled: false
  rabbitmq:                    # 生产端 confirm/returns 与消费端 AUTO 语义定稿姿态（backend 宪法 A.5-4/A.5-5）
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:                     # 消费失败有界重试默认 3 次退避（backend 宪法 A.5-5）；耗尽后经队列死信参数进 fy.dlx
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
          multiplier: 2.0
mybatis-plus:                  # MP 全局扩展（backend 宪法 A.4.3）
  type-handlers-package: com.fuyun.integration.handler  # PG uuid 列 TypeHandler 全局注册（insert 参数与 wrapper 条件两侧生效）
server:
  shutdown: graceful           # 优雅停机（backend 宪法 A.5-15）
management:
  health:
    # jms 健康指标禁用：Boot 自动装配的 JmsHealthIndicator 会对 classpath 上的 Qpid ConnectionFactory
    # 发起不带凭证的探测连接，IoTDA AMQP 强制 SASL PLAIN 鉴权致探测恒失败，actuator/health 聚合 DOWN
    # → compose healthcheck 判容器 unhealthy → iot-simulator 依赖 healthy 无法启动；
    # 业务消费者带凭证连接正常，AMQP 链路真实状态由 iot.amqp.connected / disconnect.duration.seconds
    # 等自研 Micrometer 指标承载；P1 完整化方向：自研 HealthIndicator 反映 iot.amqp.connected 真实状态。
    jms:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true          # liveness/readiness 探针显式开启（backend 宪法 A.5-15）
      show-details: never      # prod 安全默认，dev/test profile 覆盖
logging:
  pattern:
    level: "%5p [%X{traceId:-}]"   # traceId 经 MDC 关联日志：仅覆写 level 段，其余沿用 Boot 默认 pattern
fuyun:                         # 业务配置统一 fuyun.* 前缀（backend 宪法 A.2-4）
  trace:
    response-header-enabled: true  # 响应头回写 X-Trace-Id，前端排障锚点
    mdc-key: traceId
  messaging:
    idempotency-redis-ttl: 24h     # 幂等 Redis 前置键 TTL（DB 唯一索引为最终兜底，TTL 只覆盖常态重复投递窗口）
  security:
    # D-2 令牌 HMAC 密钥：仅经 FUYUN_SECURITY_TOKEN_HMAC_SECRET 环境变量注入，任何 profile 均不放默认密钥——
    # 空占位表示"未设 env 即启动 fail-fast 报缺失"，属预期安全姿态（BRIEF-PR3-01 §3.1；TTL 默认值见 SecurityProperties @DefaultValue）
    token-hmac-secret: ${FUYUN_SECURITY_TOKEN_HMAC_SECRET:}
  patient:                       # M02 患者域（字段加密密钥 A.4.2-10：仅 env 注入，空占位=未设即启动 fail-fast）
    crypto:
      data-key: ${FUYUN_PATIENT_CRYPTO_DATA_KEY:}
      mac-key: ${FUYUN_PATIENT_CRYPTO_MAC_KEY:}
  iot:                            # M14 IoT 接入（BRIEF-PR4-01 §3 properties 行；enabled=false 安全默认，
    amqp:                         #   IOTDA_* 缺失不阻塞应用启动——宪法 B.4-4；enabled=true 时连接四要素
                                  #   任一缺失启动即 fail-fast（IotAmqpConfig 装配前校验）
      # 启用开关仅经 FUYUN_IOT_AMQP_ENABLED 注入：只接受 true/false（留空会 boolean 绑定失败阻断启动），
      # 未置 env 取默认 false
      enabled: ${FUYUN_IOT_AMQP_ENABLED:false}
      endpoint: ${IOTDA_AMQP_ENDPOINT:}
      access-key: ${IOTDA_AMQP_ACCESS_KEY:}
      access-secret: ${IOTDA_AMQP_ACCESS_SECRET:}   # 敏感红线：仅 env 注入，任何 profile 禁明文默认值
      # 订阅队列清单：FUYUN_IOT_AMQP_QUEUES 逗号分隔（须与 IoTDA 规则引擎推送队列逐一对齐）；空串 env
      # 绑定为空清单（启用 AMQP 时 fail-fast），含空段（如 q1,,q2）由启用组校验拒绝空白队列名
      queues: ${FUYUN_IOT_AMQP_QUEUES:}
      # 以下参数全部取 IotProperties @DefaultValue（值词表见 IotProperties.Amqp javadoc，按需覆盖）：
      # queue-prefetch: 1000       # IoTDA 默认预取上限（宪法 A.5-9）
      # batch-size: 500            # 攒批落库条数阈值，合法区间 500–5000（宪法 A.4.2-7）
      # batch-flush-interval: 2s   # 攒批时间窗（批首消息起算超时即刷批）
      # batch-queue-capacity: 5000 # 攒批有界内存队列容量（满则消费侧阻塞背压）
      # reconnect-initial-delay: 3s  # 断链重建退避起步（宪法 A.5-9 failover 参数）
      # reconnect-max-delay: 30s    # 断链重建退避上限（指数封顶，supervisor 重建节奏）
    fallback:                     # HTTP 兜底通道（POST /ingest/iotda-fallback 独立鉴权，B4.3）
      token: ${FUYUN_IOT_FALLBACK_TOKEN:}   # 敏感红线：仅 env 注入，任何 profile 禁明文默认值；
                                            #   空默认 = 未配置，鉴权比对侧 fail-closed 一律拒绝
